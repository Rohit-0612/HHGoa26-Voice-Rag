[project]
name = "hhgoa26-voice-rag"
version = "0.1.0"
description = "Multilingual voice-enabled RAG over ai4bharat/MSMARCO-XI (14 Indic languages)"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client[fastembed]>=1.12.0",
    "datasets>=3.0.0",
    "pyarrow>=17.0.0",
    "huggingface-hub>=0.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "groq>=0.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
