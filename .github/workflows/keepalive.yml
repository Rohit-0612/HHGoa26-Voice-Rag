# Keeps the backend warm. Free hosts idle out, and a judge opening a cold link
# mid-review is the failure this exists to prevent.
#
# Set the target once, no code change needed:
#   Settings -> Secrets and variables -> Actions -> Variables -> New
#   Name: BACKEND_URL   Value: https://<your-backend>
#
# NOTE: GitHub's scheduler is best-effort and frequently runs late (5-15 min
# drift is normal under load). This reduces cold starts; it does not guarantee
# a warm service.
name: keep-backend-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL variable not set - skipping."
            exit 0
          fi
          # --max-time covers a cold start that has to load ~2.3GB of models.
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 180 \
                 "${BACKEND_URL%/}/health" || echo "000")
          echo "HTTP $code"
          head -c 400 /tmp/body || true
          # Never fail the workflow: a sleeping backend would otherwise send a
          # failure email every 10 minutes.
          exit 0
